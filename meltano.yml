send_anonymous_usage_stats: true
project_id: "tap-bling"
default_environment: test
requires_meltano: ">=4.0"
environments:
- name: test
plugins:
  extractors:
  - name: "tap-bling"
    namespace: "tap_bling"
    pip_url: -e .
    capabilities:
    - state
    - catalog
    - discover
    - about
    - stream-maps
    - structured-logging

    settings:
    - name: client_id
      kind: string
      label: Client ID
      description: The OAuth Client ID from Bling application settings.
      sensitive: true

    - name: client_secret
      kind: password
      label: Client Secret
      description: The OAuth Client Secret.
      sensitive: true

    - name: bling_refresh_token
      kind: password
      label: Refresh Token
      description: The persistent token used to fetch new access tokens.
      sensitive: true

    - name: auth_endpoint
      kind: string
      label: Auth Endpoint
      description: The URL to exchange tokens (e.g., https://api.bling.com.br/Api/v3/oauth/token).
      value: "https://api.bling.com.br/Api/v3/oauth/token"

    - name: start_date
      kind: date_iso8601
      label: Start Date
      description: Initial date to start extracting data from.

    - name: batch_size
      kind: integer
      label: Batch Size
      description: The number of IDs to process in a single API call (for Inventory).
      value: 100

    settings_group_validation:
    - [client_id, client_secret, bling_refresh_token, start_date]


    config:
      start_date: '2026-01-28'
      auth_endpoint: "https://api.bling.com.br/Api/v3/oauth/token"
      batch_size: 100

  loaders:
  - name: target-jsonl
    variant: andyh1203
    pip_url: target-jsonl